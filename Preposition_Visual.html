<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep & Adv Visual">
<meta name="theme-color" content="#1F3A5F">
<title>Preposition & Adverb Visual — My English Coach</title>
<style>
:root{
  --primary:#1F3A5F; --accent:#C5563A; --accent-soft:#E8826B;
  --sand:#F4E9DD; --bg:#FAF8F4; --card:#FFFFFF;
  --text:#2A2A2A; --muted:#6B6B6B; --border:#E5DFD3;
  --good:#2E7E73; --warn:#A07000; --bad:#A03A2A;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.container{max-width:600px;margin:0 auto;padding:18px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.home-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:99px;text-decoration:none;color:var(--primary);font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.title{margin:0;font-size:18px;color:var(--primary);font-weight:700}
.title small{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px;display:block;margin-top:2px}

.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.tab{flex:1;padding:10px 8px;text-align:center;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;transition:all 0.15s}
.tab.active{background:var(--primary);color:#fff}

.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtab{flex:1;padding:8px 10px;border:1px solid var(--border);background:var(--card);border-radius:99px;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer;text-align:center}
.subtab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.subtab .count{opacity:0.7;font-size:10px;margin-left:4px}

.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer;font-weight:600}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--card);border-radius:14px;padding:14px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  cursor:pointer;transition:transform 0.1s;
}
.card:active{transform:scale(0.98)}
.card .word{font-size:20px;font-weight:800;color:var(--primary);margin:0 0 6px;letter-spacing:-0.3px;display:flex;align-items:center;gap:6px}
.card .word .pos-badge{font-size:9px;padding:2px 6px;border-radius:99px;background:var(--sand);color:var(--accent);font-weight:700;letter-spacing:0.3px;text-transform:uppercase}
.card .core{font-size:11.5px;color:var(--muted);margin:0;line-height:1.4;min-height:32px}
.card .svg-wrap{display:flex;justify-content:center;margin:8px 0}
.card .svg-wrap svg{width:100%;max-width:140px;height:80px}
.card .level{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:var(--sand);color:var(--primary);font-weight:700;margin-top:4px}
.card .level.beginner{background:#E8F4E8;color:var(--good)}
.card .level.intermediate{background:#FFF1D4;color:var(--warn)}
.card .level.advanced{background:#FBE0DA;color:var(--bad)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:24px 22px}
.modal h2{margin:0 0 4px;font-size:32px;color:var(--primary);font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px}
.modal h2 .pos-badge{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--sand);color:var(--accent);font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
.modal .modal-core{color:var(--muted);font-size:13px;margin:0 0 14px}
.modal .modal-svg{display:flex;justify-content:center;background:var(--sand);border-radius:12px;padding:18px;margin:14px 0}
.modal .modal-svg svg{width:100%;max-width:260px;height:160px}
.modal .modal-section{margin:14px 0}
.modal .modal-section h3{font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin:0 0 8px;font-weight:700}
.modal .ex-list{list-style:none;padding:0;margin:0}
.modal .ex-list li{padding:8px 12px;background:#FAF6EE;border-radius:8px;margin-bottom:6px;font-size:13.5px;line-height:1.5;border-left:3px solid var(--accent)}
.modal .ex-list li .ja{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.modal .modal-close{display:block;width:100%;padding:12px;margin-top:18px;background:var(--primary);color:#fff;border:0;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.modal .confuse{padding:10px 12px;background:#FFF8EC;border-radius:8px;font-size:12.5px;color:#5C4A1F;line-height:1.5;border:1px solid #F0D89A}

/* Quiz */
.quiz-card{background:var(--card);border-radius:14px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px}
.quiz-progress{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600}
.quiz-bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px}
.quiz-bar-fill{height:100%;background:var(--accent);transition:width 0.3s}
.quiz-sentence{font-size:16px;line-height:1.6;color:var(--text);margin:0 0 16px}
.quiz-sentence .blank{display:inline-block;min-width:80px;border-bottom:2px dashed var(--accent);margin:0 4px;text-align:center;color:var(--accent);font-weight:700}
.quiz-sentence .ja{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.quiz-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quiz-opt{padding:14px;background:var(--card);border:2px solid var(--border);border-radius:10px;font-weight:700;font-size:15px;color:var(--primary);cursor:pointer}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{background:#E8F4E8;border-color:var(--good);color:var(--good)}
.quiz-opt.wrong{background:#FBE0DA;border-color:var(--bad);color:var(--bad)}
.quiz-feedback{margin-top:14px;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.ok{background:#E8F4E8;color:var(--good);border:1px solid #C0E0BC}
.quiz-feedback.ng{background:#FBE0DA;color:var(--bad);border:1px solid #F0CABE}
.quiz-next{display:none;width:100%;padding:14px;margin-top:12px;background:var(--primary);color:#fff;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.quiz-next.show{display:block}
.quiz-result{text-align:center;padding:30px 20px}
.quiz-result h2{font-size:28px;color:var(--primary);margin:0 0 10px}
.quiz-result .score{font-size:48px;font-weight:800;color:var(--accent);margin:8px 0}
.quiz-result .restart{padding:12px 24px;background:var(--primary);color:#fff;border:0;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <a class="home-btn" href="index.html">← Home</a>
    <h1 class="title">🧭 Preposition & Adverb<small>前置詞20 + 副詞23 をビジュアル化</small></h1>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="browse" onclick="switchMode('browse')">📚 Browse</button>
    <button class="tab" data-mode="quiz" onclick="switchMode('quiz')">🎯 Quiz</button>
  </div>

  <!-- Browse Mode -->
  <div id="browse-view">
    <div class="subtabs">
      <button class="subtab active" data-pos="prep" onclick="switchPos('prep')">📍 Preposition <span class="count">(20)</span></button>
      <button class="subtab" data-pos="adv" onclick="switchPos('adv')">⏰ Adverb <span class="count">(23)</span></button>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Quiz Mode -->
  <div id="quiz-view" style="display:none">
    <div class="subtabs">
      <button class="subtab active" data-quiz="prep" onclick="switchQuizType('prep')">📍 Preposition</button>
      <button class="subtab" data-quiz="adv" onclick="switchQuizType('adv')">⏰ Adverb</button>
      <button class="subtab" data-quiz="mix" onclick="switchQuizType('mix')">🎲 Mixed</button>
    </div>
    <div id="quiz-container"></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

// ===== SVG ILLUSTRATIONS — ADVERBS =====

function renderFilterBar(){
  const fb = document.getElementById('filter-bar');
  const cats = currentPos === 'prep' ? PREP_CATS : ADV_CATS;
  fb.innerHTML = cats.map(c => `<span class="chip ${currentCat===c.id?'active':''}" data-cat="${c.id}" onclick="filterCat('${c.id}')">${c.label}</span>`).join('');
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const data = currentData();
  const svgs = currentSvg();
  const filtered = currentCat === 'all' ? data : data.filter(d => d.cat === currentCat);
  const posLabel = currentPos === 'prep' ? 'PREP' : 'ADV';
  grid.innerHTML = filtered.map((d, i) => {
    const idx = data.indexOf(d);
    return `<div class="card" onclick="openModal(${idx})">
      <div class="word">${d.word}<span class="pos-badge">${posLabel}</span></div>
      <div class="svg-wrap">${svgs[d.word] || ''}</div>
      <p class="core">${d.core}</p>
      <span class="level ${d.level}">${d.level}</span>
    </div>`;
  }).join('');
}

function switchPos(pos){
  currentPos = pos;
  currentCat = 'all';
  document.querySelectorAll('.subtab[data-pos]').forEach(s => s.classList.toggle('active', s.dataset.pos === pos));

  renderGrid();
}

function filterCat(cat){
  currentCat = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));

}

  const data = currentData();

// ===== QUIZ =====
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startQuiz(){
  let pool;
  if(quizType === 'prep') pool = QUIZ_PREP;
  else if(quizType === 'adv') pool = QUIZ_ADV;
  else pool = shuffle([...QUIZ_PREP, ...QUIZ_ADV]).slice(0, 14);
  quizState = {
    questions: shuffle(pool).slice(0, 10),
    current: 0,
    correct: 0,
  };
  renderQuiz();
}

function switchQuizType(type){
  quizType = type;
  document.querySelectorAll('.subtab[data-quiz]').forEach(s => s.classList.toggle('active', s.dataset.quiz === type));
  startQuiz();
}

function renderQuiz(){
  const c = document.getElementById('quiz-container');
  if(quizState.current >= quizState.questions.length){
    const pct = Math.round(quizState.correct / quizState.questions.length * 100);
    let badge = '🎯', msg = 'まあまあ！';
    if(pct >= 90){badge='🏆'; msg='完璧！マスターだ';}
    else if(pct >= 70){badge='✨'; msg='よくできた！';}
    else if(pct >= 50){badge='👍'; msg='もう一歩！';}
    else {badge='📚'; msg='繰り返し練習しよう';}
    c.innerHTML = `<div class="quiz-card quiz-result">
      <div style="font-size:48px">${badge}</div>
      <h2>${msg}</h2>
      <div class="score">${quizState.correct}/${quizState.questions.length}</div>
      <div style="color:var(--muted);font-size:13px">正答率 ${pct}%</div>
      <button class="restart" onclick="startQuiz()">もう一度</button>
    </div>`;
    return;
  }
  const q = quizState.questions[quizState.current];
  const pct = Math.round(quizState.current / quizState.questions.length * 100);
  c.innerHTML = `<div class="quiz-card">
    <div class="quiz-progress"><span>Q${quizState.current+1} / ${quizState.questions.length}</span><span>${quizState.correct} 正解</span></div>
    <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${pct}%"></div></div>
    <p class="quiz-sentence">${q.sentence.replace('___','<span class="blank">___</span>')}<span class="ja">${q.ja}</span></p>
    <div class="quiz-options">
      ${q.options.map(o => `<button class="quiz-opt" onclick="answerQuiz('${o}')">${o}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="qfb"></div>
    <button class="quiz-next" id="qnext" onclick="nextQuiz()">次へ →</button>
  </div>`;
}

function answerQuiz(choice){
  const q = quizState.questions[quizState.current];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => {
    o.disabled = true;
    if(o.textContent === q.answer) o.classList.add('correct');
    else if(o.textContent === choice) o.classList.add('wrong');
  });
  const fb = document.getElementById('qfb');
  if(choice === q.answer){
    quizState.correct++;
    fb.className = 'quiz-feedback show ok';
    fb.innerHTML = `✅ 正解！<br>${q.sentence.replace('___', '<strong>'+q.answer+'</strong>')}`;
  } else {
    fb.className = 'quiz-feedback show ng';
    fb.innerHTML = `❌ 正解は <strong>${q.answer}</strong><br>${q.sentence.replace('___', '<strong>'+q.answer+'</strong>')}`;
  }
  document.getElementById('qnext').classList.add('show');
}

function nextQuiz(){
  quizState.current++;
  renderQuiz();
}

// ===== MODE SWITCH =====
function switchMode(mode){
  currentMode = mode;

  document.getElementById('browse-view').style.display = mode === 'browse' ? '' : 'none';
  document.getElementById('quiz-view').style.display = mode === 'quiz' ? '' : 'none';
  if(mode === 'quiz') startQuiz();
}
