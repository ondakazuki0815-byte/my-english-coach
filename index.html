<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My English Coach</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #f0f4ff 0%, #fff5f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #1f1e1d;
  }
  .container {
    text-align: center;
    background: white;
    padding: 60px 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    max-width: 600px;
    width: 100%;
  }
  .badge {
    display: inline-block;
    background: #c96442;
    color: white;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 38px;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    color: #6b6b6b;
    font-size: 16px;
    margin-bottom: 32px;
  }
  .quote {
    font-style: italic;
    color: #4a4a47;
    border-left: 3px solid #c96442;
    padding: 14px 0 14px 20px;
    margin: 24px 0;
    text-align: left;
    line-height: 1.6;
  }
  .quote-source {
    color: #8a8a85;
    font-size: 13px;
    margin-top: 8px;
    font-style: normal;
  }
  .footer {
    color: #6b6b6b;
    font-size: 14px;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid #e8e6e2;
  }
  .footer code {
    background: #f4f3f0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="badge">My English Coach</div>
    <h1>Hello, World!</h1>
    <p class="subtitle">英語学習サイト、構築中です。</p>

    <div class="quote">
      "The limits of my language mean the limits of my world."
      <div class="quote-source">— Ludwig Wittgenstein</div>
    </div>

    <p class="footer">
      このページは <code>GitHub</code> と <code>Netlify</code> で公開されています。
    </p>
  </div>
</body>
</html>
