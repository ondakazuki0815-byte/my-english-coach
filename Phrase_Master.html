<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phrase Master">
<meta name="theme-color" content="#1F3A5F">
<title>My English Coach — Phrase Master</title>
<style>
:root{
  --primary:#1F3A5F;
  --accent:#C5563A;
  --accent-soft:#E8826B;
  --sand:#F4E9DD;
  --bg:#FAF8F4;
  --card:#FFFFFF;
  --text:#2A2A2A;
  --muted:#6B6B6B;
  --border:#E5DFD3;
  --success:#3A7D44;
  --info:#3567A8;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);

  --role-subject-bg:#E5ECF5;   --role-subject-fg:#1F3A5F;
  --role-verb-bg:#FBE6DD;      --role-verb-fg:#C5563A;
  --role-emotion-bg:#FBE2E6;   --role-emotion-fg:#C04565;
  --role-object-bg:#F1E8DA;    --role-object-fg:#8B6F47;
  --role-location-bg:#DEEFEC;  --role-location-fg:#2E7E73;
  --role-time-bg:#ECECEC;      --role-time-fg:#5C5C5C;
  --role-amount-bg:#FFF4D6;    --role-amount-fg:#A07000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.55;
  font-size:16px;
  padding-bottom:env(safe-area-inset-bottom);
}

.header{
  background:linear-gradient(135deg,var(--primary) 0%,#2C5081 100%);
  color:#fff;padding:14px 16px 14px;
  padding-top:calc(14px + env(safe-area-inset-top));
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.title{font-size:18px;font-weight:700;letter-spacing:-0.2px}
.subtitle{font-size:12px;opacity:0.85;margin-top:2px}
.progress-wrap{margin-top:10px}
.progress-bar{height:6px;background:rgba(255,255,255,0.2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent-soft);border-radius:99px;transition:width 0.4s ease}
.progress-text{font-size:11px;margin-top:4px;opacity:0.9;display:flex;justify-content:space-between}

.modes{
  display:flex;gap:6px;padding:10px 12px;background:#fff;
  border-bottom:1px solid var(--border);overflow-x:auto;
  position:sticky;top:0;z-index:45;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.modes::-webkit-scrollbar{display:none}
.mode-btn{
  flex-shrink:0;padding:8px 12px;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;
  background:#F2EEE6;color:var(--muted);border:1px solid transparent;
  white-space:nowrap;transition:all 0.15s;font-family:inherit;
  display:flex;align-items:center;gap:5px;
}
.mode-btn.active{background:var(--primary);color:#fff}
.mode-btn.quiz{background:var(--accent);color:#fff}
.mode-btn.quiz:active{transform:scale(0.97)}

.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:10px 12px;
  background:var(--bg);position:sticky;top:46px;z-index:40;
  border-bottom:1px solid var(--border);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:7px 13px;border-radius:99px;
  font-size:12px;font-weight:600;cursor:pointer;
  background:#fff;color:var(--muted);border:1px solid var(--border);
  white-space:nowrap;transition:all 0.15s;
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .count{font-size:11px;opacity:0.8;margin-left:4px}

.search-row{padding:8px 12px;background:var(--bg)}
.search{
  width:100%;padding:10px 14px;border-radius:10px;
  border:1px solid var(--border);background:#fff;
  font-size:14px;font-family:inherit;
  -webkit-appearance:none;appearance:none;
}
.search:focus{outline:none;border-color:var(--accent)}

.section-title{
  font-size:13px;font-weight:700;color:var(--primary);
  letter-spacing:0.4px;text-transform:uppercase;
  padding:18px 16px 8px;display:flex;align-items:center;gap:8px;
}
.section-title::before{
  content:"";width:18px;height:2px;background:var(--accent);
}

.legend{
  display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 4px;font-size:11px;
}
.legend-item{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:99px;font-weight:600;
}
.legend-dot{width:8px;height:8px;border-radius:50%}

.voice-row{
  padding:8px 16px;background:var(--bg);font-size:11px;
  display:flex;align-items:center;gap:8px;
}
.voice-row label{color:var(--muted);font-weight:600}
.voice-row select{
  flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--border);
  background:#fff;font-family:inherit;font-size:12px;
  -webkit-appearance:none;appearance:none;
}

.phrases{padding:0 12px}
.phrase{
  background:var(--card);border-radius:14px;
  margin-bottom:10px;box-shadow:var(--shadow);
  border:1px solid var(--border);
  cursor:pointer;transition:all 0.15s;overflow:hidden;
  position:relative;
}
.phrase.learned{background:#F0F7F1;border-color:#CDE5D2}

.visual{
  background:linear-gradient(135deg,#FFF8EC 0%,#FAF0DD 100%);
  padding:14px 12px;
  border-bottom:1px solid var(--border);
  user-select:none;position:relative;
}
.phrase.learned .visual{background:linear-gradient(135deg,#EAF5EC 0%,#D9EDDD 100%)}

.image-only-tap{
  display:none;font-size:11px;color:var(--accent);
  margin-top:8px;font-weight:600;letter-spacing:0.5px;
  text-transform:uppercase;text-align:center;
}
body.image-only .visual .image-only-tap{display:block}
body.image-only .phrase:not(.expanded) .phrase-body{display:none}
body.image-only .phrase.expanded .phrase-body{display:block}
body.image-only .vis-label{display:none}

.vis-row{
  display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;
  justify-content:flex-start;
}
.vis-chip{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  padding:8px 10px 6px;border-radius:10px;
  min-width:62px;max-width:120px;
}
.vis-chip svg{width:30px;height:30px;display:block}
.vis-label{
  font-size:10px;font-weight:600;margin-top:3px;
  text-align:center;line-height:1.2;word-break:break-word;
}
.vis-chip.subject{background:var(--role-subject-bg);color:var(--role-subject-fg)}
.vis-chip.subject svg{fill:var(--role-subject-fg)}
.vis-chip.verb{background:var(--role-verb-bg);color:var(--role-verb-fg)}
.vis-chip.verb svg{fill:var(--role-verb-fg)}
.vis-chip.emotion{background:var(--role-emotion-bg);color:var(--role-emotion-fg)}
.vis-chip.emotion svg{fill:var(--role-emotion-fg)}
.vis-chip.object{background:var(--role-object-bg);color:var(--role-object-fg)}
.vis-chip.object svg{fill:var(--role-object-fg)}
.vis-chip.location{background:var(--role-location-bg);color:var(--role-location-fg)}
.vis-chip.location svg{fill:var(--role-location-fg)}
.vis-chip.time{background:var(--role-time-bg);color:var(--role-time-fg)}
.vis-chip.time svg{fill:var(--role-time-fg)}
.vis-chip.amount{background:var(--role-amount-bg);color:var(--role-amount-fg)}
.vis-chip.amount svg{fill:var(--role-amount-fg)}

.phrase-body{padding:14px 16px}
.phrase-head{display:flex;align-items:flex-start;gap:12px}
.check{
  flex-shrink:0;width:24px;height:24px;border-radius:50%;
  border:2px solid var(--border);background:#fff;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;cursor:pointer;transition:all 0.15s;
}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;display:none}
.phrase.learned .check{background:var(--success);border-color:var(--success)}
.phrase.learned .check svg{display:block}

/* Mastery Badge (replaces check) */
.mastery-badge{
  flex-shrink:0;min-width:36px;height:36px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.15s;font-size:14px;font-weight:700;
  background:#F0F0F0;color:#666;padding:0 8px;gap:3px;
  border:2px solid transparent;
}
.mastery-badge:active{transform:scale(0.92)}
.mastery-badge .lvl-icon{font-size:14px;line-height:1}
.mastery-badge .lvl-num{font-size:13px;font-weight:800}
.mastery-badge.level-0{background:#F0F0F0;color:#666}
.mastery-badge.level-1{background:#FBE6E2;color:#D4523F}
.mastery-badge.level-2{background:#FFF6E0;color:#D69100}
.mastery-badge.level-3{background:#E8F5EA;color:#3A7D44}
.mastery-badge.level-4{background:#E5ECF5;color:#3567A8}
.mastery-badge.level-5{background:#FFF4D6;color:#A07000;border-color:#E0B040}

/* Mastery meta on each card */
.mastery-meta{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;
}
.mastery-label{
  display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:11px;font-weight:600;
}
.next-review{
  font-size:11px;color:#888;background:#F8F6F2;padding:2px 8px;border-radius:99px;
}
.next-review.due{
  background:#FFE5C0;color:#A05500;font-weight:700;
}
.phrase.due{
  border-left:4px solid #D69100;
}

/* Mastery breakdown in header */
.mastery-breakdown{
  margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.15);
}
.brk-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.brk-chip{
  display:inline-flex;align-items:center;gap:3px;
  padding:5px 10px;border-radius:99px;
  font-size:11px;font-weight:700;
  transition:all 0.15s;user-select:none;
}
.brk-chip:active{transform:scale(0.94)}
.brk-due-btn{
  width:100%;padding:8px 12px;border-radius:8px;border:none;
  background:linear-gradient(135deg,#FFD580 0%,#F5B850 100%);
  color:#5A3500;font-weight:800;font-size:12px;cursor:pointer;
  font-family:inherit;display:block;text-align:center;
  box-shadow:0 2px 6px rgba(245,184,80,0.3);
}
.brk-due-btn:active{transform:scale(0.98)}
.brk-due-empty{
  text-align:center;font-size:11px;color:rgba(255,255,255,0.7);
  padding:6px;font-style:italic;
}
.phrase-text{flex:1;min-width:0}

.en-row{
  display:flex;align-items:flex-start;gap:8px;
}
.phrase-en{font-size:15px;font-weight:600;color:var(--text);word-break:break-word;flex:1}
.phrase.learned .phrase-en{text-decoration:line-through;color:var(--muted)}
.audio-mini{
  flex-shrink:0;width:32px;height:32px;border-radius:50%;
  background:var(--primary);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;font-family:inherit;
  transition:all 0.15s;
}
.audio-mini:active{transform:scale(0.92)}
.audio-mini.slow{background:#5B7AA0;font-size:12px}
.audio-mini.playing{animation:pulse-soft 1s infinite}
@keyframes pulse-soft{
  0%,100%{box-shadow:0 0 0 0 rgba(31,58,95,0.5)}
  50%{box-shadow:0 0 0 6px rgba(31,58,95,0)}
}
.audio-buttons{display:flex;gap:6px;margin-top:6px}

.phrase-ipa{
  font-family:'Times New Roman',serif;font-size:13px;
  color:var(--info);margin-top:5px;font-style:normal;
  letter-spacing:0.3px;
}
body.hide-jp .phrase-ipa{display:block}

.phrase-jp{font-size:13px;color:var(--muted);margin-top:3px}
body.hide-jp .phrase-jp,
body.hide-jp .example-jp{display:none}

.phrase-detail{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
  font-size:13px;color:#4a4a4a;display:none;
}
.phrase.expanded .phrase-detail{display:block}
.example-label{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.example{font-style:italic;margin-bottom:6px;line-height:1.5}
.example-jp{color:var(--muted);font-size:12px}

.log-section{margin-top:20px;padding:16px 12px 80px;background:#FFF8EC;border-top:1px solid var(--border)}
.log-intro{
  font-size:13px;color:#5a4a3a;background:#FFFCF5;
  padding:12px 14px;border-radius:10px;border:1px dashed #D9C9A0;
  margin-bottom:14px;line-height:1.5;
}
.log-form{
  background:#fff;border-radius:14px;padding:14px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  margin-bottom:14px;
}
.log-form input,.log-form textarea{
  width:100%;padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);font-family:inherit;font-size:14px;
  margin-bottom:8px;-webkit-appearance:none;appearance:none;
}
.log-form input:focus,.log-form textarea:focus{outline:none;border-color:var(--accent)}
.log-form textarea{resize:vertical;min-height:60px}
.log-form-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.log-form select{
  padding:10px 12px;border-radius:8px;border:1px solid var(--border);
  font-family:inherit;font-size:14px;background:#fff;flex:1;
  -webkit-appearance:none;appearance:none;
}
.log-form button{
  width:100%;padding:11px;border-radius:8px;border:none;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;
  cursor:pointer;font-family:inherit;
}
.log-form button:active{background:#A4452D}
.log-entry{
  background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.log-entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.log-entry-en{font-weight:600;font-size:15px;flex:1;word-break:break-word}
.tag{
  display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:11px;font-weight:600;
  background:var(--sand);color:var(--primary);
}
.log-entry-jp{font-size:13px;color:var(--muted);margin-top:4px}
.log-entry-ex{font-size:13px;font-style:italic;color:#4a4a4a;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.log-entry-foot{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.delete-btn{
  background:none;border:none;color:#C5563A;font-size:12px;
  cursor:pointer;padding:4px 8px;font-family:inherit;
}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 12px;font-style:italic}

.utility{padding:16px 12px;text-align:center;font-size:12px;color:var(--muted)}
.utility a{color:var(--accent);text-decoration:none;cursor:pointer}

/* Quiz Overlay */
.quiz-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(135deg,#1F3A5F 0%,#0E2440 100%);
  z-index:200;color:#fff;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  flex-direction:column;
}
.quiz-overlay.open{display:flex}
.quiz-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.1);
}
.quiz-title{font-size:15px;font-weight:700}
.quiz-progress{font-size:12px;opacity:0.85}
.quiz-close{
  background:rgba(255,255,255,0.15);border:none;color:#fff;
  width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.quiz-body{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  padding:20px;overflow-y:auto;
}
.quiz-card{
  width:100%;max-width:420px;background:rgba(255,255,255,0.95);
  border:1px solid rgba(255,255,255,0.12);border-radius:20px;
  padding:22px 18px;text-align:center;
  min-height:260px;color:var(--text);
  display:flex;flex-direction:column;justify-content:center;
}
.quiz-card .vis-row{justify-content:center;gap:8px}
.quiz-card .vis-chip{padding:10px 12px 8px;min-width:72px;max-width:140px}
.quiz-card .vis-chip svg{width:38px;height:38px}
.quiz-card .vis-label{font-size:11px}
.quiz-jp{font-size:14px;color:#7E5C40;margin-top:14px;font-weight:500}
.quiz-en{
  font-size:22px;font-weight:700;color:var(--primary);line-height:1.4;
  margin-top:14px;word-break:break-word;
}
.quiz-ipa{
  font-family:'Times New Roman',serif;font-size:14px;
  color:var(--info);margin-top:6px;letter-spacing:0.3px;
}
.quiz-example{
  font-size:13px;color:#4a4a4a;font-style:italic;line-height:1.55;
  padding-top:12px;margin-top:10px;border-top:1px dashed var(--border);
}
.quiz-example-jp{font-size:12px;color:var(--muted);margin-top:5px}
.quiz-audio{
  margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
}
.quiz-audio button{
  padding:8px 12px;border-radius:99px;border:none;
  background:var(--primary);color:#fff;font-family:inherit;
  font-size:12px;font-weight:600;cursor:pointer;
}
.quiz-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin-top:20px}
.q-btn{
  padding:14px 16px;border-radius:12px;border:none;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:transform 0.1s;
}
.q-btn:active{transform:scale(0.97)}
.q-btn-reveal{background:#fff;color:var(--primary)}
.q-btn-row{display:flex;gap:10px}
.q-btn-row .q-btn{flex:1}
.q-btn-good{background:#3A7D44;color:#fff}
.q-btn-bad{background:#C5563A;color:#fff}
.quiz-result{text-align:center;padding:30px 20px;color:#fff;max-width:400px}
.quiz-result h2{font-size:24px;margin:0 0 6px}
.quiz-result .score{font-size:54px;font-weight:800;color:#FFD7B5;margin:18px 0}
.quiz-result-detail{font-size:14px;opacity:0.85;margin-bottom:20px;line-height:1.6}

/* ===== Quiz Mode Picker / Config ===== */
.quiz-config{
  text-align:center;padding:30px 20px;color:#fff;max-width:420px;width:100%;
}
.quiz-config h2{font-size:22px;margin:0 0 8px}
.quiz-config p{opacity:0.85;font-size:14px;margin:0 0 18px;line-height:1.6}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.q-opt{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);
  color:#fff;padding:14px 16px;border-radius:12px;
  font-family:inherit;font-size:14px;cursor:pointer;text-align:left;
  transition:transform 0.1s, background 0.15s;
}
.q-opt:hover{background:rgba(255,255,255,0.15)}
.q-opt:active{transform:scale(0.98)}
.q-opt > span > strong{display:block;font-size:15px;margin-bottom:3px;color:#FFD7B5}
.q-opt > span > small{display:block;font-size:11.5px;opacity:0.8}

/* ===== Quiz Scenario (Stage 1 & 2) ===== */
.quiz-scenario{
  background:linear-gradient(135deg,#FFF8EC 0%,#FAF0DD 100%);
  border:1px solid #E0CB9A;border-radius:12px;
  padding:12px 14px;margin-bottom:14px;
  text-align:left;color:var(--text);
}
.quiz-scenario-label{
  font-size:10px;color:var(--accent);font-weight:700;
  letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;
}
.quiz-scenario-text{
  font-size:14px;color:#5a4a3a;font-weight:600;line-height:1.5;
}

/* ===== Production Mode (Stage 2) ===== */
.prod-input{
  width:100%;padding:12px 14px;border-radius:10px;
  border:2px solid var(--border);font-family:inherit;font-size:15px;
  margin-top:14px;color:var(--text);background:#fff;
  resize:vertical;min-height:70px;line-height:1.5;
  -webkit-appearance:none;appearance:none;
}
.prod-input:focus{outline:none;border-color:var(--accent)}

.prod-mic-wrap{
  display:flex;flex-direction:column;align-items:center;
  margin-top:18px;gap:10px;
}
.prod-mic{
  width:80px;height:80px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-soft) 100%);
  color:#fff;font-size:32px;cursor:pointer;
  box-shadow:0 6px 18px rgba(197,86,58,0.4);
  transition:transform 0.15s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.prod-mic:active{transform:scale(0.92)}
.prod-mic.recording{
  background:linear-gradient(135deg,#D4523F 0%,#FF6B5A 100%);
  animation:prod-pulse 1.4s infinite;
}
@keyframes prod-pulse{
  0%,100%{box-shadow:0 6px 18px rgba(212,82,63,0.5)}
  50%{box-shadow:0 6px 26px rgba(212,82,63,0.85),0 0 0 10px rgba(212,82,63,0.15)}
}
.prod-mic-status{font-size:13px;color:#666;font-weight:500}
.prod-mic-result{
  font-size:14px;color:#444;font-style:italic;
  background:#F5F1E8;padding:10px 14px;border-radius:10px;
  border:1px dashed #D9C9A0;margin-top:6px;
  min-height:42px;width:100%;max-width:380px;line-height:1.5;
  word-break:break-word;text-align:left;
}

.prod-score-wrap{
  display:flex;flex-direction:column;align-items:center;
  margin:16px 0 10px;
}
.prod-score-num{
  font-size:42px;font-weight:800;color:var(--primary);line-height:1;
}
.prod-score-num small{font-size:14px;color:var(--muted);font-weight:600}
.prod-score-label{font-size:13px;font-weight:700;color:var(--accent);margin-top:4px}

.prod-diff{
  background:#F8F6F2;border-radius:10px;padding:12px;
  margin-top:8px;font-size:14px;line-height:1.8;border:1px solid var(--border);
}
.prod-diff-label{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.prod-diff-text{color:var(--text);word-break:break-word;text-align:left}
.w-match{color:#3A7D44;font-weight:600}
.w-miss{color:#D4523F;text-decoration:line-through;font-weight:600}
.w-extra{color:#A07000;font-style:italic;font-weight:600}

@media(min-width:720px){
  body{font-size:15px}
  .header{padding:18px 32px 16px}
  .title{font-size:20px}
  .modes{padding:12px 32px;top:0}
  .tabs{padding:12px 32px;top:50px}
  .search-row{padding:10px 32px}
  .voice-row{padding:10px 32px}
  .phrases{padding:0 24px;max-width:760px;margin:0 auto}
  .log-section{padding:20px 24px 80px;max-width:760px;margin:0 auto}
  .section-title{padding:24px 24px 8px}
  .legend{padding:10px 32px 4px}
  .vis-chip svg{width:34px;height:34px}
}

// ============== MASTERY / SPACED REPETITION (Ebbinghaus) ==============
const MASTERY_LEVELS = [
  {id:0, label:"未着手",     icon:"⚪", color:"#999",    bg:"#F0F0F0"},
  {id:1, label:"新規",       icon:"🔴", color:"#D4523F", bg:"#FBE6E2"},
  {id:2, label:"学習中",     icon:"🟡", color:"#D69100", bg:"#FFF6E0"},
  {id:3, label:"定着中",     icon:"🟢", color:"#3A7D44", bg:"#E8F5EA"},
  {id:4, label:"準マスター", icon:"🔵", color:"#3567A8", bg:"#E5ECF5"},
  {id:5, label:"マスター",   icon:"⭐", color:"#A07000", bg:"#FFF4D6"}
];
// Days until next review at each level (Ebbinghaus-inspired)
const REVIEW_INTERVALS_DAYS = [0, 1, 3, 7, 14, 30];
const DAY_MS = 24*60*60*1000;

function getMastery(key){
  return state.mastery[key] || { level:0, lastReviewedAt:0, nextReviewAt:0, reviewCount:0, correctCount:0 };
}
function levelInfo(level){ return MASTERY_LEVELS[Math.max(0, Math.min(5, level))]; }

function advanceMastery(key){
  const m = getMastery(key);
  m.level = Math.min(5, m.level + 1);
  m.lastReviewedAt = Date.now();
  m.reviewCount = (m.reviewCount||0) + 1;
  m.correctCount = (m.correctCount||0) + 1;
  m.nextReviewAt = Date.now() + REVIEW_INTERVALS_DAYS[m.level] * DAY_MS;
  state.mastery[key] = m;
  saveState();
}
function regressMastery(key){
  const m = getMastery(key);
  m.level = 1; // back to "新規・要復習"
  m.lastReviewedAt = Date.now();
  m.reviewCount = (m.reviewCount||0) + 1;
  m.nextReviewAt = Date.now() + REVIEW_INTERVALS_DAYS[1] * DAY_MS;
  state.mastery[key] = m;
  saveState();
}
function resetPhraseMastery(key){
  delete state.mastery[key];
  saveState();
}

function getMasteryStats(){
  const counts = [0,0,0,0,0,0];
  for(const p of PHRASES){
    const m = getMastery(p.en);
    counts[m.level || 0]++;
  }
  return counts;
}

function getDueForReview(){
  const now = Date.now();
  return PHRASES.filter(p=>{
    const m = getMastery(p.en);
    if(m.level === 0) return false; // not started
    if(m.level === 5 && m.nextReviewAt > now) return false; // mastered, not due yet
    return m.nextReviewAt <= now;
  });
}

function formatDaysUntil(ts){
  if(!ts) return "";
  const diff = ts - Date.now();
  if(diff <= 0) return "今すぐ";
  const days = Math.ceil(diff / DAY_MS);
  if(days === 1) return "明日";
  if(days < 7) return days + "日後";
  if(days < 30) return Math.ceil(days/7) + "週後";
  return Math.ceil(days/30) + "ヶ月後";
}

const STORAGE_KEY = "phraseMaster_v3";
const OLD_KEYS = ["phraseMaster_v2","phraseMaster_v1"];
let state = loadState();

function loadState(){
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      for(const k of OLD_KEYS){
        const old = localStorage.getItem(k);
        if(old){ raw = old; break; }
      }
    }
    if(raw) {
      const s = JSON.parse(raw);
      // Migrate old binary "mastered" → new 5-level "mastery" if needed
      let mastery = s.mastery || {};
      if(s.mastered && !s.mastery){
        for(const key of Object.keys(s.mastered)){
          mastery[key] = {
            level: 5, // "Mastered" since previously flagged as learned
            lastReviewedAt: s.mastered[key] || Date.now(),
            nextReviewAt: Date.now() + 30 * 24*60*60*1000,
            reviewCount: 1,
            correctCount: 1
          };
        }
      }
      return {
        mastered:s.mastered||{}, // kept for backward compat (read-only)
        mastery: mastery,
        log:s.log||[],
        activeCat:s.activeCat||"all",
        search:"",
        hideJp:!!s.hideJp,
        imageOnly:!!s.imageOnly,
        voicePref:s.voicePref||"",
        quizStats:s.quizStats||{played:0,correct:0,total:0},
        lessonsApplied:s.lessonsApplied||{},
        masteryFilter: (s.masteryFilter !== undefined) ? s.masteryFilter : null
      };
    }
  }catch(e){}
  return { mastered:{}, mastery:{}, log:[], activeCat:"all", search:"", hideJp:false, imageOnly:false, voicePref:"", quizStats:{played:0,correct:0,total:0}, lessonsApplied:{}, masteryFilter:null };
}

function seedLessonPhrases(){
  // Auto-add lesson-sourced phrases to the user's log on first load.
  // Only runs once per lessonId — won't re-add if user deletes them.
  let added = 0;
  for(const p of LESSON_PHRASES){
    if(state.lessonsApplied[p.lessonId + "|" + p.en]) continue;
    state.log.unshift({
      en:p.en, jp:p.jp, ex:p.ex||"", cat:p.cat||"industry",
      ts:Date.now(), source:"lesson", lessonId:p.lessonId
    });
    state.lessonsApplied[p.lessonId + "|" + p.en] = true;
    added++;
  }
  if(added > 0) saveState();
  return added;
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

// ============== AUDIO (TTS) ==============
let voices = [];
function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  populateVoiceSelect();
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function populateVoiceSelect(){
  const sel = document.getElementById("voiceSelect");
  if(!sel) return;
  const englishVoices = voices.filter(v=>v.lang && v.lang.startsWith("en"));
  if(englishVoices.length === 0){
    sel.innerHTML = `<option>音声未対応のブラウザです</option>`;
    return;
  }
  const order = ["en-US","en-GB","en-AU","en-IN","en-CA","en"];
  const sorted = englishVoices.sort((a,b)=>{
    const ai = order.findIndex(p=>a.lang.startsWith(p));
    const bi = order.findIndex(p=>b.lang.startsWith(p));
    return (ai<0?99:ai) - (bi<0?99:bi);
  });
  sel.innerHTML = sorted.map(v=>{
    const flag = v.lang.startsWith("en-US") ? "🇺🇸" :
                 v.lang.startsWith("en-GB") ? "🇬🇧" :
                 v.lang.startsWith("en-AU") ? "🇦🇺" :
                 v.lang.startsWith("en-IN") ? "🇮🇳" :
                 v.lang.startsWith("en-CA") ? "🇨🇦" : "🌍";
    return `<option value="${escapeAttr(v.name)}">${flag} ${escapeHtml(v.name)} (${v.lang})</option>`;
  }).join("");
  if(state.voicePref && sorted.some(v=>v.name===state.voicePref)){
    sel.value = state.voicePref;
  }
  sel.onchange = ()=>{
    state.voicePref = sel.value;
    saveState();
  };
}
function getSelectedVoice(){
  const sel = document.getElementById("voiceSelect");
  if(!sel) return voices.find(v=>v.lang && v.lang.startsWith("en"));
  return voices.find(v=>v.name === sel.value) || voices.find(v=>v.lang && v.lang.startsWith("en"));
}
function speak(text, rate=1.0){
  if(!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = getSelectedVoice();
  if(v){ u.voice = v; u.lang = v.lang; }
  else u.lang = "en-US";
  u.rate = rate;
  u.pitch = 1.0;
  u.volume = 1.0;
  window.speechSynthesis.speak(u);
}

function renderTabs(){

  tabsEl.innerHTML = CATS.map(c=>{

    const active = state.activeCat===c.id ? "active":"";

}
function setCat(c){ state.activeCat=c; saveState(); renderTabs(); renderPhrases(); }

function renderVis(visArr){
  if(!visArr || !visArr.length) return "";
  return `<div class="vis-row">${visArr.map(v=>`
    <div class="vis-chip ${escapeHtml(v.role)}">
      <svg><use href="#i-${escapeHtml(v.icon)}"></use></svg>
      <div class="vis-label">${escapeHtml(v.label)}</div>
    </div>`).join("")}</div>`;
}

function renderPhrases(){
  const list = document.getElementById("phraseList");
  const q = (state.search||"").toLowerCase().trim();
  let items = PHRASES.filter(p=>{
    if(state.activeCat!=="all" && p.cat!==state.activeCat) return false;
    if(state.masteryFilter !== null && state.masteryFilter !== undefined){
      const m = getMastery(p.en);
      if(m.level !== state.masteryFilter) return false;
    }
    if(q){
      const hay = (p.en+" "+p.jp+" "+p.ex+" "+p.exJp).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(items.length===0){
    list.innerHTML = `<div class="empty">該当するフレーズがありません</div>`;
    return;
  }
  list.innerHTML = items.map((p)=>{
    const key = p.en;
    const m = getMastery(key);
    const lvl = levelInfo(m.level);
    const learned = m.level >= 5 ? "learned":"";
    const safeEn = escapeAttr(p.en);
    const dueSoon = m.nextReviewAt && m.nextReviewAt <= Date.now() && m.level > 0 && m.level < 5;
    const nextLabel = m.level > 0 && m.level < 5 ? formatDaysUntil(m.nextReviewAt) : "";
    return `
      <div class="phrase ${learned} ${dueSoon?"due":""}" data-key="${escapeHtml(key)}" onclick="toggleExpand(this)">
        <div class="visual">
          ${renderVis(p.vis)}
          <div class="image-only-tap">タップで答えを見る</div>
        </div>
        <div class="phrase-body">
          <div class="phrase-head">
            <div class="mastery-badge level-${m.level}" onclick="event.stopPropagation();toggleLearned('${escapeHtml(key)}')" title="タップで記憶レベルを進める (現在: ${lvl.label})">
              <span class="lvl-icon">${lvl.icon}</span>
              <span class="lvl-num">${m.level}</span>
            </div>
            <div class="phrase-text">
              <div class="en-row">
                <div class="phrase-en">${escapeHtml(p.en)}</div>
                <button class="audio-mini" onclick="event.stopPropagation();speak('${safeEn}',1.0)" title="標準速度">🔊</button>
                <button class="audio-mini slow" onclick="event.stopPropagation();speak('${safeEn}',0.7)" title="ゆっくり">🐢</button>
              </div>
              ${p.ipa ? `<div class="phrase-ipa">${escapeHtml(p.ipa)}</div>` : ""}
              <div class="phrase-jp">${escapeHtml(p.jp)}</div>
              ${m.level > 0 ? `<div class="mastery-meta"><span class="mastery-label" style="background:${lvl.bg};color:${lvl.color}">${lvl.icon} ${escapeHtml(lvl.label)}</span>${nextLabel ? ` <span class="next-review${dueSoon?' due':''}">📅 復習: ${escapeHtml(nextLabel)}</span>`:""}</div>` : ""}
              <div class="phrase-detail">
                <div class="example-label">Example</div>
                <div class="example">${escapeHtml(p.ex)}</div>
                <div class="example-jp">${escapeHtml(p.exJp)}</div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }).join("");
}
function toggleExpand(el){ el.classList.toggle("expanded"); }

function toggleLearned(key){
  // Cycle through mastery levels: 0 → 1 → 2 → 3 → 4 → 5 → 0
  const m = getMastery(key);
  if(m.level >= 5){
    // Reset back to 0
    delete state.mastery[key];
    delete state.mastered[key];
  } else if(m.level === 0){
    // Initial mark: jump to level 1 (新規)
    state.mastery[key] = {
      level: 1,
      lastReviewedAt: Date.now(),
      nextReviewAt: Date.now() + REVIEW_INTERVALS_DAYS[1] * DAY_MS,
      reviewCount: 1,
      correctCount: 1
    };
  } else {
    // Advance one level
    advanceMastery(key);
  }
  // Sync legacy mastered flag for backward compat (level 5 = mastered)
  if(getMastery(key).level >= 5) state.mastered[key] = Date.now();
  else delete state.mastered[key];
  saveState();
  renderPhrases();
  renderProgress();
}

function renderProgress(){
  const total = PHRASES.length;
  const counts = getMasteryStats();
  const mastered = counts[5];
  const learning = counts[1] + counts[2] + counts[3] + counts[4];
  // Weighted score: each level contributes proportionally (out of 100%)
  const weighted = (counts[1]*0.2 + counts[2]*0.4 + counts[3]*0.6 + counts[4]*0.8 + counts[5]*1.0);
  const pct = Math.round(weighted/total*100);
  document.getElementById("counter").textContent = `${mastered} / ${total}`;
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("percent").textContent = pct+"%";

  // Update mastery breakdown bar (if exists)
  const breakdownEl = document.getElementById("masteryBreakdown");
  if(breakdownEl){
    const due = getDueForReview().length;
    const activeF = state.masteryFilter;
    const chip = (lv, count, info) => {
      const isActive = activeF === lv;
      const opacity = (activeF !== null && activeF !== lv) ? "opacity:0.45;" : "";
      const ring = isActive ? "box-shadow:0 0 0 2px " + info.color + ";" : "";
      return `<span class="brk-chip" style="background:${info.bg};color:${info.color};${opacity}${ring}cursor:pointer" onclick="setMasteryFilter(${lv})">${info.icon} ${count}${isActive?' ✕':''}</span>`;
    };
    breakdownEl.innerHTML = `
      <div class="brk-row">
        ${[1,2,3,4,5].map(lv => counts[lv] > 0 ? chip(lv, counts[lv], MASTERY_LEVELS[lv]) : "").filter(Boolean).join("")}
        ${counts[0] > 0 ? chip(0, counts[0], {bg:"#F0F0F0",color:"#666",icon:"⚪ 未着手"}) : ""}
        ${activeF !== null ? `<span class="brk-chip" style="background:rgba(255,255,255,0.2);color:#fff;cursor:pointer" onclick="setMasteryFilter(null)">フィルター解除 ✕</span>` : ""}
      </div>
      ${due > 0 ? `<button class="brk-due-btn" onclick="openReviewMode()">📅 今日の復習: ${due}件 ▶</button>` : `<div class="brk-due-empty">✅ 今日の復習なし</div>`}
    `;
  }
}

function setMasteryFilter(level){
  // Toggle off if clicking the same level
  if(state.masteryFilter === level) state.masteryFilter = null;
  else state.masteryFilter = level;
  saveState();
  renderPhrases();
  renderProgress();
}

function startQuizWithMode(quizMode){
  let deck = PHRASES.filter(p=>state.activeCat==="all" || p.cat===state.activeCat);
  if(deck.length===0){ alert("クイズに使えるフレーズがありません"); return; }
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  deck = deck.slice(0, Math.min(10, deck.length));
  quiz = { deck, idx:0, results:[], showJp:!state.hideJp, mode:"front", isReview:false, quizMode };
  const titleMap = {
    image: "🎴 Mode 1: 絵だけ",
    scenario: "🎬 Mode 2: シーン + 絵",
    production: "🎤 Mode 3: プロダクション"
  };
  document.getElementById("quizTitle").textContent = titleMap[quizMode] || "🎯 Quiz";
  renderQuiz();
}
function closeQuiz(){
  document.getElementById("quizOverlay").classList.remove("open");
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  quiz = null;
}
function renderQuiz(){
  if(!quiz) return;
  const body = document.getElementById("quizBody");
  const prog = document.getElementById("quizProgress");
  if(quiz.idx >= quiz.deck.length){
    const correct = quiz.results.filter(r=>r==="good").length;
    const total = quiz.deck.length;
    const pct = Math.round(correct/total*100);
    state.quizStats.played += 1;
    state.quizStats.correct += correct;
    state.quizStats.total += total;
    saveState();
    prog.textContent = "完了 🎉";
    body.innerHTML = `
      <div class="quiz-result">
        <h2>クイズ完了！</h2>
        <div class="score">${correct} / ${total}</div>
        <div class="quiz-result-detail">
          正答率 ${pct}%${pct>=80?" — 素晴らしい！":pct>=60?" — もう少し！":" — 復習しましょう"}<br>
          通算: ${state.quizStats.correct} / ${state.quizStats.total} 問正解（${state.quizStats.played} 回プレイ）
        </div>
        <button class="q-btn q-btn-reveal" onclick="openQuiz()">🔁 もう一回</button>
        <button class="q-btn q-btn-bad" onclick="closeQuiz()">閉じる</button>
      </div>`;
    return;
  }
  prog.textContent = `${quiz.idx+1} / ${quiz.deck.length}`;
  const p = quiz.deck[quiz.idx];
  const safeEn = escapeAttr(p.en);
  const scenario = getScenario(p.en);
  const mode = quiz.quizMode || "image";

  if(quiz.mode === "front"){
    if(mode === "production"){
      renderProductionFront(p, body, scenario, safeEn);
    } else {
      // image or scenario mode
      const scenarioHtml = (mode === "scenario" && scenario)
        ? `<div class="quiz-scenario">
             <div class="quiz-scenario-label">📍 シーン</div>
             <div class="quiz-scenario-text">${escapeHtml(scenario)}</div>
           </div>`
        : "";
      const promptText = (mode === "scenario") ? "この場面で何と言う？" : "この絵が表すフレーズは？";
      body.innerHTML = `
        <div class="quiz-card">
          ${scenarioHtml}
          ${renderVis(p.vis)}
          ${quiz.showJp ? `<div class="quiz-jp" style="margin-top:14px">${escapeHtml(p.jp)}</div>` : `<div class="quiz-jp" style="color:#999;font-style:italic;margin-top:14px">${promptText}</div>`}
        </div>
        <div class="quiz-actions">
          <button class="q-btn q-btn-reveal" onclick="quizReveal()">👀 答えを見る</button>
          <div style="text-align:center;font-size:12px;opacity:0.7;margin-top:6px">
            <a style="color:#FFD7B5;cursor:pointer;text-decoration:underline" onclick="quizToggleJp()">${quiz.showJp?"日本語ヒントを隠す":"日本語ヒントを表示"}</a>
          </div>
        </div>`;
    }
  } else {
    // back screen — same for all modes (with extra production results if applicable)
    const scenarioHtml = (mode === "scenario" || mode === "production") && scenario
      ? `<div class="quiz-scenario" style="margin-bottom:10px">
           <div class="quiz-scenario-label">📍 シーン</div>
           <div class="quiz-scenario-text">${escapeHtml(scenario)}</div>
         </div>`
      : "";
    const productionResults = (mode === "production" && quiz.score !== undefined) ? `
      <div class="prod-score-wrap">
        <div class="prod-score-num">${quiz.score}<small>/100</small></div>
        <div class="prod-score-label">${quiz.score>=90?'🌟 Excellent!':quiz.score>=75?'💪 Good!':quiz.score>=50?'📈 Keep practicing':'🌱 Try again'}</div>
      </div>
      <div class="prod-diff">
        <div class="prod-diff-label">あなたの回答 vs ターゲット:</div>
        <div class="prod-diff-text">${quiz.diffHtml || ""}</div>
      </div>
    ` : "";
    body.innerHTML = `
      <div class="quiz-card">

// ============== PRODUCTION MODE (Stage 2) ==============
function renderProductionFront(p, body, scenario, safeEn){

    ? `<div class="quiz-scenario">
         <div class="quiz-scenario-label">📍 シーン</div>
         <div class="quiz-scenario-text">${escapeHtml(scenario)}</div>
       </div>`
    : "";

    // Initial: pick input method
    body.innerHTML = `
      <div class="quiz-card">
        ${scenarioHtml}
        ${renderVis(p.vis)}
        <div style="margin-top:18px;font-size:14px;font-weight:600;color:var(--primary)">この場面で英語で言ってみてください 💪</div>
      </div>
      <div class="quiz-actions">
        <div class="q-btn-row">
          <button class="q-btn" style="background:#2E7E73;color:#fff" onclick="setQuizInput('text')">⌨️ タイピング</button>
          <button class="q-btn" style="background:#C5563A;color:#fff" onclick="setQuizInput('voice')">🎤 音声で答える</button>
        </div>
      </div>`;
    return;
  }

  if(quiz.inputMode === "text"){
    body.innerHTML = `
      <div class="quiz-card">
        ${scenarioHtml}
        ${renderVis(p.vis)}
        <textarea id="prodInput" class="prod-input" placeholder="ここに英語で入力..." rows="3"></textarea>
      </div>
      <div class="quiz-actions">
        <button class="q-btn q-btn-reveal" onclick="submitProductionText()">✅ 採点する</button>
        <button class="q-btn" style="background:rgba(255,255,255,0.15);color:#fff;font-size:12px;padding:8px" onclick="resetQuizInput()">入力方法を変える</button>
      </div>`;
    setTimeout(()=>{ const el=document.getElementById("prodInput"); if(el) el.focus(); }, 100);
  } else if(quiz.inputMode === "voice"){
    const isRecording = quiz.isQuizRecording;
    body.innerHTML = `
      <div class="quiz-card">
        ${scenarioHtml}
        ${renderVis(p.vis)}
        <div class="prod-mic-wrap">
          <button class="prod-mic ${isRecording?'recording':''}" onclick="toggleQuizRecording()">${isRecording?'⏹':'🎙'}</button>
          <div class="prod-mic-status">${isRecording ? '🔴 録音中... タップで停止' : 'マイクをタップして録音開始'}</div>
          <div class="prod-mic-result">${escapeHtml(quiz.voiceResult || '（聞き取り結果がここに表示されます）')}</div>
        </div>

        ${quiz.voiceResult ? `<button class="q-btn q-btn-reveal" onclick="submitProductionVoice()">✅ 採点する</button>` : ''}

      </div>`;
  }
}

function setQuizInput(mode){
  quiz.inputMode = mode;
  quiz.voiceResult = "";
  quiz.isQuizRecording = false;
  renderQuiz();
}
function resetQuizInput(){
  if(quiz.quizRecognition){ try{ quiz.quizRecognition.abort(); }catch(e){} }
  quiz.inputMode = null;
  quiz.voiceResult = "";
  quiz.isQuizRecording = false;
  renderQuiz();
}

function submitProductionText(){
  const el = document.getElementById("prodInput");
  if(!el) return;
  const input = el.value.trim();
  if(!input){ alert("英語を入力してください"); return; }
  scoreProduction(input);
}

function submitProductionVoice(){
  if(!quiz.voiceResult || !quiz.voiceResult.trim()){
    alert("音声がまだ取れていません。録音してから採点してください");
    return;
  }
  scoreProduction(quiz.voiceResult);
}

function toggleQuizRecording(){
  if(!quiz) return;
  if(quiz.isQuizRecording){ stopQuizRecording(); }
  else { startQuizRecording(); }
}

async function startQuizRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("このブラウザは音声認識に対応していません"); return; }
  try{
    // Request mic permission
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop()); // we only need permission, recognition will use its own
  }catch(err){
    alert("マイクの利用許可が必要です: " + err.message);
    return;
  }
  quiz.voiceResult = "";
  quiz.isQuizRecording = true;
  quiz.quizRecognition = new SR();
  quiz.quizRecognition.lang = (getSelectedVoice() && getSelectedVoice().lang) || 'en-US';
  quiz.quizRecognition.continuous = true;
  quiz.quizRecognition.interimResults = true;
  quiz.quizRecognition.maxAlternatives = 1;

  quiz.quizRecognition.onresult = (e)=>{
    let interim = "", finalT = "";
    for(let i=e.resultIndex; i<e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalT += t;
      else interim += t;
    }
    if(finalT) quiz.voiceResult += finalT;
    const resultEl = document.querySelector(".prod-mic-result");
    if(resultEl) resultEl.textContent = (quiz.voiceResult + interim).trim() || "聞き取り中...";
  };
  quiz.quizRecognition.onend = ()=>{
    if(quiz && quiz.isQuizRecording){
      // auto-restart for long phrases
      setTimeout(()=>{
        if(quiz && quiz.isQuizRecording){
          try{ quiz.quizRecognition.start(); }catch(e){ console.warn("restart skip:", e.message); }
        }
      }, 200);
    }
  };
  try{ quiz.quizRecognition.start(); renderQuiz(); }
  catch(e){ quiz.isQuizRecording = false; alert("録音開始に失敗: " + e.message); }
}

function stopQuizRecording(){
  if(!quiz) return;
  quiz.isQuizRecording = false;
  try{ quiz.quizRecognition && quiz.quizRecognition.stop(); }catch(e){}
  renderQuiz();
}

function scoreProduction(userInput){
  const target = quiz.deck[quiz.idx].en;
  const tWords = quizNormalize(target).split(/\s+/).filter(Boolean);
  const sWords = quizNormalize(userInput).split(/\s+/).filter(Boolean);
  const diff = quizWordDiff(tWords, sWords);
  const matched = diff.filter(d=>d.type==="match").length;
  const score = tWords.length > 0 ? Math.round(matched/tWords.length*100) : 0;

  quiz.userInput = userInput;
  quiz.score = score;
  quiz.diffHtml = diff.map(d=>{
    if(d.type==="match") return `<span class="w-match">${escapeHtml(d.word)}</span> `;
    if(d.type==="miss")  return `<span class="w-miss">${escapeHtml(d.word)}</span> `;
    return `<span class="w-extra">[${escapeHtml(d.word)}]</span> `;
  }).join("");
  quiz.mode = "back";
  renderQuiz();
}

// Number-to-word normalization (so "90%" === "ninety percent")
const _PM_NUM_WORDS = {
  "0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five",
  "6":"six","7":"seven","8":"eight","9":"nine","10":"ten",
  "11":"eleven","12":"twelve","13":"thirteen","14":"fourteen","15":"fifteen",
  "16":"sixteen","17":"seventeen","18":"eighteen","19":"nineteen","20":"twenty",
  "30":"thirty","40":"forty","50":"fifty","60":"sixty","70":"seventy",
  "80":"eighty","90":"ninety","100":"one hundred"
};
function _pmNumToWords(n){
  if(_PM_NUM_WORDS[n]) return _PM_NUM_WORDS[n];
  const num = parseInt(n);
  if(isNaN(num)) return n;
  if(num >= 21 && num <= 99){
    const tens = Math.floor(num/10)*10;
    const ones = num%10;
    if(ones === 0) return _PM_NUM_WORDS[String(tens)] || n;
    return (_PM_NUM_WORDS[String(tens)] || "") + " " + (_PM_NUM_WORDS[String(ones)] || "");
  }
  return n;
}
function quizNormalize(s){
  let t = (s||"").toLowerCase()
    .replace(/[.,!?;:"'""''()—]/g," ")
    .replace(/\s+/g," ").trim();
  t = t.replace(/(\d+)\s*%/g, (m, n) => _pmNumToWords(n) + " percent");
  t = t.replace(/(\d+)\s*-\s*(\d+)/g, (m, a, b) => _pmNumToWords(a) + " to " + _pmNumToWords(b));
  t = t.replace(/\b(\d{1,3})\b/g, (m, n) => _pmNumToWords(n));
  t = t.replace(/-/g, " ").replace(/\s+/g, " ").trim();
  return t;
}
// Smart split: try to split concatenated words ("accuracysecond" → "accuracy" + "second")
function _pmSmartSplit(tokens, targetSet){
  const result = [];
  for(const tok of tokens){
    if(targetSet.has(tok) || tok.length < 6){ result.push(tok); continue; }
    let split = null;
    for(let i = 2; i < tok.length - 1; i++){
      const left = tok.slice(0, i);
      const right = tok.slice(i);
      if(targetSet.has(left) && targetSet.has(right)){ split = [left, right]; break; }
    }
    if(!split){
      for(let i = 2; i < tok.length - 3; i++){
        const left = tok.slice(0, i);
        if(!targetSet.has(left)) continue;
        for(let j = i+2; j < tok.length - 1; j++){
          const mid = tok.slice(i, j);
          const right = tok.slice(j);
          if(targetSet.has(mid) && targetSet.has(right)){ split = [left, mid, right]; break; }
        }
        if(split) break;
      }
    }
    if(split) result.push(...split);
    else result.push(tok);
  }
  return result;
}
function quizWordDiff(target, said){
  const targetSet = new Set(target);
  said = _pmSmartSplit(said, targetSet);
  const m = target.length, n = said.length;
  const dp = Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(target[i-1] === said[j-1]) dp[i][j] = dp[i-1][j-1] + 1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const result = [];
  let i = m, j = n;
  while(i>0 || j>0){
    if(i>0 && j>0 && target[i-1] === said[j-1]){
      result.unshift({type:"match",word:target[i-1]}); i--; j--;
    } else if(j>0 && (i===0 || dp[i][j-1] >= dp[i-1][j])){
      result.unshift({type:"extra",word:said[j-1]}); j--;
    } else {
      result.unshift({type:"miss",word:target[i-1]}); i--;
    }
  }
  return result;
}
function quizReveal(){ quiz.mode = "back"; renderQuiz(); }
function quizToggleJp(){ quiz.showJp = !quiz.showJp; renderQuiz(); }
function quizMark(result){
  quiz.results.push(result);
  const p = quiz.deck[quiz.idx];
  if(result === "good"){
    advanceMastery(p.en);
    if(getMastery(p.en).level >= 5) state.mastered[p.en] = Date.now();
  } else {
    regressMastery(p.en);
    delete state.mastered[p.en];
  }
  saveState();
  renderProgress();
  // Reset production-mode state for next question
  if(quiz.quizRecognition){ try{ quiz.quizRecognition.abort(); }catch(e){} }
  quiz.inputMode = null;
  quiz.voiceResult = "";
  quiz.isQuizRecording = false;
  quiz.userInput = "";
  quiz.score = undefined;
  quiz.diffHtml = "";
  quiz.idx += 1;
  quiz.mode = "front";
  renderQuiz();
}

function openReviewMode(){
  const due = getDueForReview();
  if(due.length === 0){
    alert("今日の復習対象はありません。素晴らしい！");
    return;
  }
  // Shuffle due deck
  const deck = [...due];
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  // Default review mode: scenario (Mode 2) for richer practice
  quiz = { deck: deck.slice(0, Math.min(15, deck.length)), idx:0, results:[], showJp:!state.hideJp, mode:"front", isReview:true, quizMode:"scenario" };
  document.getElementById("quizOverlay").classList.add("open");
  document.getElementById("quizTitle").textContent = "📅 今日の復習 (シーンモード)";
  renderQuiz();
}

// ============== LOG ==============
function addLog(){
  const en = document.getElementById("logEn").value.trim();
  const jp = document.getElementById("logJp").value.trim();
  const ex = document.getElementById("logEx").value.trim();
  const cat = document.getElementById("logCat").value;
  if(!en){ alert("英語フレーズを入力してください"); return; }
  state.log.unshift({ en, jp, ex, cat, ts:Date.now() });
  saveState();
  document.getElementById("logEn").value="";
  document.getElementById("logJp").value="";
  document.getElementById("logEx").value="";
  renderLog();
}
function deleteLog(idx){
  if(confirm("このログを削除しますか？")){
    state.log.splice(idx,1);
    saveState();
    renderLog();
  }
}
function renderLog(){
  const el = document.getElementById("logList");
  if(!state.log || state.log.length===0){
    el.innerHTML = `<div class="empty">まだログがありません<br>上のフォームから追加しましょう 📝</div>`;
    return;
  }
  el.innerHTML = state.log.map((l,idx)=>{
    const date = new Date(l.ts);
    const dateStr = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`;
    const catLabel = (CATS.find(c=>c.id===l.cat)||{label:l.cat}).label;
    const safeEn = escapeAttr(l.en);
    const sourceTag = l.source === "lesson"
      ? `<span class="tag" style="background:#FFE5B4;color:#8B5A00">🎓 レッスン</span>`
      : "";
    return `
      <div class="log-entry"${l.source==="lesson" ? ' style="border-left:3px solid #D69100"' : ''}>
        <div class="log-entry-head">
          <div class="log-entry-en">${escapeHtml(l.en)}</div>
          <button class="audio-mini" onclick="speak('${safeEn}',1.0)" style="width:28px;height:28px;font-size:12px">🔊</button>
          ${sourceTag}
          <span class="tag">${escapeHtml(catLabel)}</span>
        </div>
        ${l.jp?`<div class="log-entry-jp">${escapeHtml(l.jp)}</div>`:""}
        ${l.ex?`<div class="log-entry-ex">${escapeHtml(l.ex)}</div>`:""}
        <div class="log-entry-foot">
          <span>${dateStr}</span>
          <button class="delete-btn" onclick="deleteLog(${idx})">削除</button>
        </div>
      </div>
    `;
  }).join("");
}

// ============== UTIL ==============
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function escapeAttr(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function exportData(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `phrase_master_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function resetMastery(){
  if(confirm("すべてのフレーズの記憶レベルをリセットします。よろしいですか？\n（My Phrase Logとクイズ統計は消えません）")){
    state.mastered = {};
    state.mastery = {};
    saveState();
    renderPhrases();
    renderProgress();
  }
}
